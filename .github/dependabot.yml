version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    open-pull-requests-limit: 2
    schedule:
      interval: "monthly"
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/frontend/src-tauri"
    open-pull-requests-limit: 2
    schedule:
      interval: "monthly"
    groups:
      tauri-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/rust"
    # Pre-1.0 Rig upgrades change its model/agent APIs and need a migration.
    ignore:
      - dependency-name: "rig-core"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2
    schedule:
      interval: "monthly"
    groups:
      rust-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/"
    open-pull-requests-limit: 2
    schedule:
      interval: "monthly"
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 2
    schedule:
      interval: "monthly"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
