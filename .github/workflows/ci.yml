name: CI

# Repositório privado: cada minuto de Actions conta na cota grátis (Windows
# conta em dobro). A cada push só lint e testes no Linux; Windows roda toda
# segunda ou sob demanda; Rust tem workflow próprio (rust.yml).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'assets/**'
      - 'frontend/**'
      - 'supabase/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'  # segunda, 6h em Brasília

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra server

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra server --extra inference-cloud

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/crates/nicx-ponte/Cargo.toml

      - name: Run tests
        # COVERAGE_CORE=sysmon uses CPython 3.12's sys.monitoring backend,
        # which is dramatically cheaper than the default C trace function.
        # -n auto fans the suite out across all runner cores via pytest-xdist.
        env:
          COVERAGE_CORE: sysmon
        run: |
          uv run pytest tests/ -n auto -q --tb=short -m "not live and not cloud and not hub" \
            --cov=nicx \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60

      - name: Upload coverage report
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  # Windows job — empirically exercises the platform-specific code paths that
  # the Ubuntu `test` job can never reach: GlobalMemoryStatusEx RAM detection
  # and the cp9xx -> UTF-8 stdout reconfigure. Also the only CI
  # job that builds + imports the mandatory `nicx_rust` PyO3 extension
  # on Windows. Public repo -> Windows runner minutes are free.
  #
  # All `run:` steps use static commands only (no `github.event.*`
  # interpolation), so there is no workflow-injection surface here.
  test-windows:
    # Só na rodada semanal ou sob demanda: minuto de Windows conta em dobro.
    if: github.event_name != 'push'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = common; 3.13 = the supported ceiling — installing there guards
        # against a numpy/native wheel gap at the top of the range, which
        # is exactly how the source-build failure slips in on Windows.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra server

      # Pure-Python check — runs before the Rust build so a flaky toolchain
      # install can never mask the actual RAM-detection verification.
      - name: Verify Windows RAM detection
        shell: bash
        run: |
          uv run python -c "from nicx.nucleo.config import _total_ram_gb; ram = _total_ram_gb(); print(f'GlobalMemoryStatusEx RAM = {ram} GB'); assert ram > 0, f'Windows RAM detection returned {ram}, expected > 0'"

      - name: Run Windows-specific tests (hardware + CLI + daemon)
        shell: bash
        run: |
          uv run pytest tests/hardware/test_hardware_profiles.py tests/comandos/test_cli.py tests/comandos/test_daemon_cmd.py tests/comandos/test_daemon_state.py tests/nucleo/test_utils.py tests/install/test_windows_prerequisites.py -v -m "not live and not cloud"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify GUI process ownership and cleanup
        shell: bash
        run: uv run pytest tests/comandos/test_gui_cmd.py tests/comandos/test_gui_lifecycle.py -v

      - name: Build + import the PyO3 extension on Windows
        shell: bash
        run: |
          uv run maturin develop --manifest-path rust/crates/nicx-ponte/Cargo.toml
          uv run python -c "import nicx_rust; print('nicx_rust imports on Windows OK')"

      - name: Smoke-test CLI
        shell: bash
        run: |
          uv run nicx --version
