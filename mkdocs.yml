site_name: Nicx
site_description: A inteligência artificial da Falkyria, rodando no seu computador
site_author: Falkyria
repo_url: https://github.com/Dracon-46/FalkyriaNicx
repo_name: Dracon-46/FalkyriaNicx
copyright: Copyright &copy; 2026 Falkyria

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Modo claro

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Início: index.md
  - Instalação: instalacao.md
  - Uso: uso.md
  - Configuração: configuracao.md
  - Arquitetura: arquitetura.md
  - Voz: voz.md
  - Privacidade: privacidade.md
  - Desenvolvimento: desenvolvimento.md
