[workspace]
resolver = "2"
members = [
    "crates/nicx-core",
    "crates/nicx-engine",
    "crates/nicx-agents",
    "crates/nicx-tools",
    "crates/nicx-learning",
    "crates/nicx-telemetry",
    "crates/nicx-traces",
    "crates/nicx-security",
    "crates/nicx-mcp",
    "crates/nicx-python",
    "crates/nicx-sessions",
    "crates/nicx-workflow",
    "crates/nicx-skills",
    "crates/nicx-recipes",
    "crates/nicx-templates",
    "crates/nicx-a2a",
    "crates/nicx-scheduler",
]

# uuid 1.27 requires Rust 1.89; keep this aligned with rust-toolchain.toml.
[workspace.package]
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }
regex = "1"
once_cell = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
parking_lot = "0.12"
async-trait = "0.1"
pyo3 = { version = "0.29", features = ["extension-module"] }
meval = "0.2"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tokio-stream = "0.1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
fnmatch-regex = "0.2"
url = "2"
rig-core = "0.31"
schemars = "1"
